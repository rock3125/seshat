# Seshat — the block to add to an existing nginx on the target machine.
#
# install.sh writes a copy of this with your real values filled in, at
# nginx/seshat.generated.conf. This is the annotated reference.
#
# WHERE IT GOES: inside the existing `server { ... }` block that already serves
# the host — alongside whatever else that server does. Seshat owns exactly one
# path prefix and touches nothing outside it.
#
#     sudo cp seshat.conf /etc/nginx/snippets/seshat.conf
#     # then, inside the server block for your host:
#     #     include /etc/nginx/snippets/seshat.conf;
#     sudo nginx -t && sudo systemctl reload nginx
#
# WHY ONLY ONE LOCATION: the stack publishes a single port, and the nginx inside
# it already routes the three things the browser touches —
#     /seshat/        the SPA
#     /seshat/api/    the gateway (chat SSE, MCP, chunk lookups)
#     /seshat/auth/   Keycloak
# — so this forwards the whole prefix, unchanged, and lets that inner nginx
# sort it out. Do not try to split the three here: /seshat/auth in particular
# must arrive with its path intact or Keycloak's relative-path routing breaks.

# `^~`, NOT a plain prefix match. It is load-bearing.
#
# nginx evaluates regex locations BEFORE prefix locations, and a great many
# sites carry some form of dotfile guard:
#
#     location ~ /\. { deny all; }
#
# OIDC discovery lives at /.well-known/openid-configuration, which contains
# "/." — so that regex wins over a plain `location /seshat/` and returns 403
# for the one endpoint the sign-in flow cannot start without. Everything else
# works, which makes it look like a Keycloak fault rather than a routing one.
#
# `^~` tells nginx that if this prefix matches, it must not go on to consider
# regex locations at all. The dotfile guard keeps protecting the rest of the
# site; it simply stops applying inside /seshat/, where nothing is served from
# disk anyway.
location ^~ /seshat/ {
    # 127.0.0.1, not 0.0.0.0: docker-compose publishes the stack on loopback,
    # so nginx is the only thing that can reach it.
    proxy_pass http://127.0.0.1:8800;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # THIS ONE MATTERS. Keycloak builds every redirect and issuer URL from the
    # forwarded scheme. Terminate TLS here and send `http` and it will hand the
    # browser http:// links from an https:// page, which the browser blocks as
    # mixed content — and the token issuer then disagrees with the gateway's
    # expected issuer, so every sign-in fails with an unexplained 401.
    #
    # Hardcode `https` if this server block is TLS. $scheme is correct too, as
    # long as there is no other proxy in front of this one.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # The chat answer is a Server-Sent Events stream, written event by event as
    # the model produces tokens. With buffering on, nginx accumulates the whole
    # response and flushes it at the end: the answer arrives complete, all at
    # once, after a silence that is indistinguishable from a hung server.
    proxy_buffering off;
    proxy_cache off;

    # A model turn with several tool calls can run past the 60s default, and a
    # timeout mid-stream truncates the answer with no error the UI can show.
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;

    # Keycloak's admin console posts forms larger than the 1m default.
    client_max_body_size 20m;
}

# Optional: send a bare / to the app, if this host serves nothing else.
# Leave it out when the server block already has its own site at the root.
#
# location = / {
#     return 302 /seshat/;
# }
