# The single public entrance. Everything the browser touches is on one origin
# under one prefix, which is what makes the app same-origin (no CORS in the
# browser's way) and what lets an outer reverse proxy forward exactly one path:
#
#   /seshat/        the SPA
#   /seshat/api/    the gateway  (chat SSE, /mcp, /chunk, /config)
#   /seshat/auth/   Keycloak
#
# Keycloak is served under its own relative path (KC_HTTP_RELATIVE_PATH), so
# the request URI it receives is already the one it expects — this only has to
# forward it unchanged and tell it which scheme and host the browser used.

# THIS STACK IS USUALLY BEHIND A SECOND PROXY, and these three maps are what
# stop this one from lying to Keycloak about it.
#
# The chain is: browser --https--> outer nginx --http--> this nginx --http-->
# keycloak. The outer proxy correctly announces the original request with
# X-Forwarded-Proto: https. If this server then sets that header from its OWN
# $scheme — which is `http`, because that is how the outer proxy reached it —
# it overwrites the truth with a local detail, and Keycloak answers every
# external request with its "HTTPS required" page. The same applies to the port
# ($server_port is 80 here, not 443) and the host.
#
# So: forward what arrived if anything did, and fall back to this server's own
# values only when nothing is in front of us. `map` evaluates per request and
# an empty header selects the "" branch.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_port $fwd_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $host;
}

# The access log, as JSON, so Alloy ships fields rather than parsing a line.
#
# `escape=json` is not optional: without it a request path containing a quote
# or a backslash produces a line that is not valid JSON, and the one request
# worth looking at — the malformed one — is the one that arrives unparsed.
#
# `ts` and `msg` are named to match what every other service in the stack
# emits; see observability/alloy-config.alloy, which maps the rest.
log_format json_combined escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"service":"ui",'
    '"level":"info",'
    '"msg":"$request",'
    '"status":$status,'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,'
    '"remote_addr":"$remote_addr",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$http_x_request_id"'
    '}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout json_combined;

    # The build output lives at /usr/share/nginx/html/seshat, so the on-disk
    # layout matches the public path one-for-one and every location below is a
    # plain `root` lookup.
    absolute_redirect off;

    # A bare / is not this app's to own — the outer proxy may host other things
    # beside it. Send it to where the app actually lives.
    location = / {
        return 302 /seshat/;
    }

    location = /seshat {
        return 302 /seshat/;
    }

    # --- the gateway ---------------------------------------------------------

    # The Prometheus scrape endpoint is UNAUTHENTICATED — Prometheus holds no
    # token, and giving it one would mean a service-account client, a refresh
    # loop and a credential in the scrape config, all to protect a document
    # that says how many chunks are indexed. The control is reachability
    # instead: Prometheus reaches the gateway directly on the compose network,
    # and this makes sure the published proxy is not a second way in.
    #
    # An exact-match location, before the prefix match below, so it wins.
    location = /seshat/api/metrics {
        access_log off;
        return 404;
    }

    # Before the SPA location, so /seshat/api never falls into the try_files
    # rule and gets answered with index.html.
    location /seshat/api/ {
        proxy_pass http://gateway:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $fwd_proto, not $scheme — see the maps at the top of this file. The
        # gateway records the client address and the scheme on every audit row.
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Server-Sent Events. Every one of these matters: with buffering on,
        # nginx holds the whole answer and delivers it in one lump at the end,
        # which looks exactly like a hung server for the ten seconds a real
        # answer takes. The long read timeout covers a slow model turn, and
        # chunked encoding must stay off so each event flushes as written.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        chunked_transfer_encoding off;

        # Document uploads (POST /upload) come through here. Keep this at or
        # above the gateway's UPLOAD_MAX_MB: nginx enforces its limit first, and
        # its 413 is an HTML error page rather than the JSON the UI knows how to
        # read, so a mismatch shows up as an unexplained failure.
        client_max_body_size 32m;
    }

    # --- Keycloak ------------------------------------------------------------
    # No URI on proxy_pass: the path is forwarded verbatim, which is what
    # KC_HTTP_RELATIVE_PATH=/seshat/auth expects to receive.
    location /seshat/auth/ {
        proxy_pass http://keycloak:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The three that decide whether Keycloak believes the request was
        # secure. Getting these from $scheme/$server_port is what produces the
        # "HTTPS required" page for every user behind a TLS-terminating proxy,
        # while working perfectly from localhost — because sslRequired=external
        # exempts private addresses, so the bug hides during local testing.
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Port  $fwd_port;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        # Keycloak's admin console posts large forms (a realm import, a long
        # policy) and the default 1m rejects them.
        client_max_body_size 20m;
    }

    # --- the SPA -------------------------------------------------------------
    # Fingerprinted build output: content-hashed, so it can be cached hard.
    location /seshat/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path under the prefix is a client-side route: serve the shell.
    # index.html names the hashed asset files, so it must never be cached — a
    # stale shell points at files the last deploy already deleted.
    location /seshat/ {
        try_files $uri $uri/ /seshat/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
