# The single public entrance. Everything the browser touches is on one origin
# under one prefix, which is what makes the app same-origin (no CORS in the
# browser's way) and what lets an outer reverse proxy forward exactly one path:
#
#   /seshat/        the SPA
#   /seshat/api/    the gateway  (chat SSE, /mcp, /chunk, /config)
#   /seshat/auth/   Keycloak
#
# Keycloak is served under its own relative path (KC_HTTP_RELATIVE_PATH), so
# the request URI it receives is already the one it expects — this only has to
# forward it unchanged and tell it which scheme and host the browser used.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout;

    # The build output lives at /usr/share/nginx/html/seshat, so the on-disk
    # layout matches the public path one-for-one and every location below is a
    # plain `root` lookup.
    absolute_redirect off;

    # A bare / is not this app's to own — the outer proxy may host other things
    # beside it. Send it to where the app actually lives.
    location = / {
        return 302 /seshat/;
    }

    location = /seshat {
        return 302 /seshat/;
    }

    # --- the gateway ---------------------------------------------------------
    # Before the SPA location, so /seshat/api never falls into the try_files
    # rule and gets answered with index.html.
    location /seshat/api/ {
        proxy_pass http://gateway:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events. Every one of these matters: with buffering on,
        # nginx holds the whole answer and delivers it in one lump at the end,
        # which looks exactly like a hung server for the ten seconds a real
        # answer takes. The long read timeout covers a slow model turn, and
        # chunked encoding must stay off so each event flushes as written.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        chunked_transfer_encoding off;

        # Document uploads (POST /upload) come through here. Keep this at or
        # above the gateway's UPLOAD_MAX_MB: nginx enforces its limit first, and
        # its 413 is an HTML error page rather than the JSON the UI knows how to
        # read, so a mismatch shows up as an unexplained failure.
        client_max_body_size 32m;
    }

    # --- Keycloak ------------------------------------------------------------
    # No URI on proxy_pass: the path is forwarded verbatim, which is what
    # KC_HTTP_RELATIVE_PATH=/seshat/auth expects to receive.
    location /seshat/auth/ {
        proxy_pass http://keycloak:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # Keycloak's admin console posts large forms (a realm import, a long
        # policy) and the default 1m rejects them.
        client_max_body_size 20m;
    }

    # --- the SPA -------------------------------------------------------------
    # Fingerprinted build output: content-hashed, so it can be cached hard.
    location /seshat/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path under the prefix is a client-side route: serve the shell.
    # index.html names the hashed asset files, so it must never be cached — a
    # stale shell points at files the last deploy already deleted.
    location /seshat/ {
        try_files $uri $uri/ /seshat/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
