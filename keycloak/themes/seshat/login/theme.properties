# Seshat login theme — keycloak.v2 (PatternFly 5) with the Se-ber pigment
# system layered on top.
#
# css/styles.css is the parent theme's own sheet, resolved up the hierarchy;
# css/seshat.css restyles it. Extending rather than replacing means Keycloak's
# templates keep working through a version upgrade — only the paint is ours.
parent=keycloak.v2
styles=css/styles.css css/seshat.css
