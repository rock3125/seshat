<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 128" width="100%" height="100%" role="img" aria-label="SESHAT">
  <!-- The horizontal lockup for the sign-in page: mark, then wordmark.
       Served as a CSS background-image, so nothing here can inherit a page
       token — the reversed (light-on-navy... light-on-carbon) inks are written
       out, because the login theme paints a dark ground. The arc keeps rubric,
       which is the identity's one hard rule: the arc is the only red stroke. -->
  <g fill="none" stroke="#E6E4DC" stroke-width="5.5" stroke-linecap="round">
    <line x1="64" y1="58" x2="64" y2="36"/>
    <line x1="70.25" y1="61.01" x2="87.46" y2="47.30"/>
    <line x1="71.80" y1="67.78" x2="93.25" y2="72.67"/>
    <line x1="67.47" y1="73.21" x2="77.02" y2="93.03"/>
    <line x1="60.53" y1="73.21" x2="50.98" y2="93.03"/>
    <line x1="56.20" y1="67.78" x2="34.75" y2="72.67"/>
    <line x1="57.74" y1="61.01" x2="40.54" y2="47.30"/>
  </g>
  <path d="M 24 34 C 24 -4, 104 -4, 104 34" fill="none" stroke="#D2543C" stroke-width="5.5" stroke-linecap="round"/>
  <g fill="none" stroke="#E6E4DC" stroke-width="5.5" stroke-linecap="round">
    <line x1="64" y1="98" x2="64" y2="112"/>
    <line x1="42" y1="116" x2="86" y2="116"/>
  </g>

  <text x="140" y="82" font-family="Palatino Linotype, Book Antiqua, Palatino, Georgia, serif"
        font-size="46" letter-spacing="7" fill="#E6E4DC">SE<tspan fill="#D2543C">·</tspan>SHAT</text>
</svg>
